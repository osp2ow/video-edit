/* 레이아웃: 왼쪽 설정 · 가운데 미리보기 · 오른쪽 화면 구성 · 아래 타임라인 (연습실 조명 같은 따뜻한 다크) */
:root {
  --bg: #13110e;
  --panel: #1b1915;
  --raise: #25221c;
  --line: #312c24;
  --fg: #ece5d8;
  --muted: #a1988a;
  --dim: #6d6659;
  --accent: #ff8a1f;
  --accent-ink: #1d1104;
  --good: #63c58f;
  --warn: #f0b44c;
  --wave-v: #d9cbb2;
  --wave-r: #8bd26a;
  --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; overscroll-behavior-x: none; }   /* 매직 마우스·트랙패드로 옆으로 밀 때 뒤로 가기 안 되게 */
body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.5 var(--font); }
#root { height: 100%; }
button, input, select { font: inherit; color: inherit; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.dim { color: var(--dim); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  height: 100%;
  display: grid;
  grid-template-columns: 300px minmax(0, 1fr) 292px;
  grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "top top top" "left center right" "bottom bottom bottom";
}
.hidden-video { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

/* 상단 */
.top {
  grid-area: top; display: flex; align-items: center; gap: 20px;
  padding: 10px 18px; border-bottom: 1px solid var(--line); background: var(--panel); min-width: 0;
}
.brand { display: flex; align-items: center; gap: 10px; flex: none; }
.brand h1 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
.ver { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 1px 8px; }
.logo { display: inline-flex; gap: 3px; align-items: flex-end; height: 16px; }
.logo i { width: 4px; height: 9px; border-radius: 1px; background: var(--dim); }
.logo i:first-child { height: 16px; background: var(--accent); }
.status { flex: 1; min-width: 0; color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status.ok { color: var(--good); }
.status.warn { color: var(--warn); white-space: normal; }
.status.busy { color: var(--fg); }
.status.busy::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 50%; background: var(--accent); animation: pulse 0.9s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.25; } }

/* 패널 */
.panel { background: var(--panel); overflow-y: auto; min-height: 0; padding: 4px 0 20px; position: relative; }   /* 안쪽의 숨긴 파일 입력칸(절대 위치)이 페이지 밖으로 삐져나가 페이지가 아래로 스크롤되지 않게 */
.panel.left { grid-area: left; border-right: 1px solid var(--line); }
.panel.right { grid-area: right; border-left: 1px solid var(--line); }
.panel section { padding: 14px 18px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
.panel h2 { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: var(--muted); }
.field { display: grid; gap: 6px; }
.field > label { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.note { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.55; }

.btn {
  border: 1px solid var(--line); background: var(--raise); border-radius: 8px; padding: 7px 12px; cursor: pointer;
  transition: background 0.12s, border-color 0.12s;
}
.btn:hover:not(:disabled) { border-color: #4a4337; background: #2d2922; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.sm { padding: 4px 10px; font-size: 12px; border-radius: 7px; }
.btn.ghost { background: transparent; }
.btn.accent { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.accent:hover:not(:disabled) { background: #ff9c40; border-color: #ff9c40; }
.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }

input[type="number"], input[type="text"], select {
  background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; min-width: 0;
}
input[type="text"] { flex: 1; }
.big-input { width: 92px; font-size: 18px; font-weight: 500; padding: 4px 8px; }
.num { width: 64px; font-size: 15px; }
output.big { font-size: 16px; min-width: 96px; text-align: center; }
input[type="range"] { width: 100%; accent-color: var(--accent); }

.switch { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 12.5px; }
/* 켜고 끄는 스위치: 앱 전체 같은 모양 (체크박스를 둥근 스위치로) */
.switch input[type=checkbox] { appearance: none; -webkit-appearance: none; margin: 0; flex: none; position: relative; width: 34px; height: 20px; border-radius: 999px;
  background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.18); cursor: pointer; transition: background .15s, border-color .15s; }
.switch input[type=checkbox]::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #e9e1d3; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.4); }
.switch input[type=checkbox]:checked { background: var(--accent); border-color: var(--accent); }
.switch input[type=checkbox]:checked::after { transform: translateX(14px); background: #fff; }
.switch input[type=checkbox]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.switch input[type=checkbox]:disabled { opacity: .45; cursor: default; }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sec-head h2 { margin: 0; }
.sec-head h2 label { cursor: pointer; }
.sec-off { opacity: .4; pointer-events: none; filter: grayscale(0.6); }
.card-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 6px 0 4px; }
.card-tile { display: flex; flex-direction: column; gap: 9px; padding: 12px 12px 11px; border-radius: 10px; cursor: pointer; min-height: 70px;
  border: 1.5px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.03); transition: border-color .15s, background .15s; }
.card-tile:hover { border-color: rgba(255,138,31,0.5); }
.card-tile.on { border-color: var(--accent); background: rgba(255,138,31,0.12); }
.card-tile .ct-title { font-weight: 700; font-size: 14px; white-space: nowrap; }
.card-tile.on .ct-title { color: var(--accent); }
.card-tile .ct-bot { display: flex; align-items: center; gap: 7px; }
.card-tile .ct-state { font-size: 12px; color: var(--dim); }
.card-tile.on .ct-state { color: var(--fg); font-weight: 600; }
.subbox .sub-title { font-weight: 700; color: var(--accent); }
.switch em { color: var(--dim); font-style: normal; font-family: var(--mono); font-size: 11px; }

.chip { font-size: 11px; padding: 2px 8px; border-radius: 99px; border: 1px solid currentColor; }
.chip.good { color: var(--good); }
.chip.warn { color: var(--warn); }

/* 파일 슬롯 */
.slot {
  display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto; column-gap: 10px;
  padding: 9px 12px; border: 1px dashed #3d372d; border-radius: 10px; cursor: pointer; background: var(--bg);
}
.slot:hover { border-color: var(--accent); }
.slot:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
.slot.filled { border-style: solid; background: var(--raise); }
.slot input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.slot-label { font-weight: 600; font-size: 13px; }
.slot-name { grid-row: 2; color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.slot.filled .slot-name { color: var(--fg); font-family: var(--mono); font-size: 11px; }
.slot-act { grid-row: 1 / 3; grid-column: 2; align-self: center; font-size: 11.5px; color: var(--accent); }

/* 트랙 */
.track { display: grid; grid-template-columns: 52px 64px 1fr; align-items: center; gap: 8px; }
.track.off { opacity: 0.5; }
.tbtn {
  border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 3px 0; font-size: 11.5px; cursor: pointer; color: var(--muted);
}
.tbtn.on { background: color-mix(in srgb, var(--c) 18%, transparent); border-color: var(--c); color: var(--c); font-weight: 600; }
.tlabel { font-size: 12.5px; }

.thumb-btn { margin-left: 2px; }
@media (max-width: 800px) { .thumb-body { grid-template-columns: 1fr; } }

.font-list { list-style: none; margin: 4px 0 0; padding: 4px; max-height: 240px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); animation: cs-drop .18s ease-out; }
.font-list button { display: block; width: 100%; text-align: left; padding: 6px 10px; border: 0; border-radius: 6px; background: transparent; color: var(--fg); font-size: 16px; line-height: 1.3; cursor: pointer; }
.font-list button:hover { background: rgba(255,255,255,0.06); }
.font-list button.on { background: color-mix(in srgb, var(--accent) 18%, transparent); color: #ffd9b3; }


.ex-results { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.ex-results li { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.seg .ck { margin-right: 4px; font-size: 11px; }
.summary dd { white-space: pre-line; }

.tl-cut.on { background: #ff7a7a; color: #1b0f0f; border-color: #ff7a7a; }
.tl-head { gap: 8px; }

.tl-loop.on { background: #f2c94c; color: #1d1608; border-color: #f2c94c; }

.card-text { width: 100%; box-sizing: border-box; resize: vertical; min-height: 58px; background: var(--bg-2, var(--bg)); color: inherit; border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; font: 500 13.5px/1.45 var(--font); }
.card-text.title { font-weight: 700; font-size: 14.5px; min-height: 52px; }
.card-text:focus { outline: none; border-color: #ffd27a; }
.card-text::placeholder { color: var(--dim); font-weight: 500; font-size: 12.5px; }

.card-text.title.big { min-height: 110px; font-size: 15px; }
.card-sub-in { width: 100%; box-sizing: border-box; }
.card-style { display: grid; gap: 6px; }
.card-style .cs-toggle { justify-self: start; }
.card-style-body { display: grid; gap: 8px; padding-top: 2px; }
.card-style .cs-lab { min-width: 44px; }
.card-style .swatch { width: 20px; height: 20px; }

.needed-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.needed-head .needed-title { margin: 0; }

.outro-tpl { display: grid; gap: 5px; }
.outro-tpl .chips { display: flex; flex-wrap: wrap; gap: 5px; }
.tpl-chip { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.tpl-chip button { border: 0; background: transparent; color: var(--fg); font: 600 12px var(--font); padding: 4px 10px; cursor: pointer; }
.tpl-chip button.on { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--fg); }
.tpl-chip .tpl-x { padding: 4px 8px 4px 2px; color: var(--muted); }
.tpl-add { border: 1px dashed var(--line); background: transparent; color: var(--muted); border-radius: 999px; font: 600 12px var(--font); padding: 4px 10px; cursor: pointer; }
.tpl-add:disabled { opacity: .4; cursor: default; }
/* 다른 컴퓨터에서 같은 프로젝트를 고쳤을 때 */
.remote-edit { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); width: min(460px, 92%); z-index: 3; display: grid; gap: 10px;
  background: rgba(27,25,21,0.97); border: 1px solid var(--accent); border-radius: 12px; padding: 12px 14px; font-size: 12.5px; line-height: 1.5; box-shadow: 0 6px 24px rgba(0,0,0,.45); }
.tl-bpm { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 8px; border: 1px solid var(--line, #3a342c); border-radius: 6px; }
.tl-bpm input { width: 64px; padding: 2px 6px; font: inherit; font-variant-numeric: tabular-nums; }
.src-list { display: flex; flex-direction: column; gap: 6px; margin: 4px 0 8px; }
.src-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid var(--line, #3a342c); border-radius: 8px; font-size: 12px; }
.src-item .src-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.src-item .src-num { font-variant-numeric: tabular-nums; opacity: .7; }
.usage-row.sub { color: var(--muted); font-size: 12px; align-items: center; gap: 8px; }
.usage-row select { max-width: 60%; font-size: 12px; }
.cost-total { font-size: 15px; }
.usage .note.small { margin: 2px 0 0; font-size: 11px; color: var(--dim); }
.outro-pages { display: grid; gap: 8px; }
.outro-page { display: grid; gap: 6px; padding: 8px; border: 1px dashed var(--line); border-radius: 8px; }
.outro-page.off { opacity: 0.55; }
.tl-fade { display: inline-flex; gap: 6px; align-items: center; }
.src-item:has(.src-bpm) { flex-wrap: wrap; }
.src-bpm { flex-basis: 100%; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.rot-row input[type=range] { flex: 1; }
.replace-btn { cursor: pointer; }
</style>
