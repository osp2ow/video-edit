/* 레이아웃: 왼쪽 설정 · 가운데 미리보기 · 오른쪽 화면 구성 · 아래 타임라인 (연습실 조명 같은 따뜻한 다크) */
:root {
  --bg: #13110e;
  --panel: #1b1915;
  --raise: #25221c;
  --line: #312c24;
  --fg: #ece5d8;
  --muted: #a1988a;
  --dim: #6d6659;
  --accent: #ff8a1f;
  --accent-ink: #1d1104;
  --good: #63c58f;
  --warn: #f0b44c;
  --wave-v: #d9cbb2;
  --wave-r: #8bd26a;
  --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 13px/1.5 var(--font); }
#root { height: 100%; }
button, input, select { font: inherit; color: inherit; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.dim { color: var(--dim); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  height: 100%;
  display: grid;
  grid-template-columns: 300px minmax(0, 1fr) 292px;
  grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "top top top" "left center right" "bottom bottom bottom";
}
.hidden-video { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

/* 상단 */
.top {
  grid-area: top; display: flex; align-items: center; gap: 20px;
  padding: 10px 18px; border-bottom: 1px solid var(--line); background: var(--panel); min-width: 0;
}
.brand { display: flex; align-items: center; gap: 10px; flex: none; }
.brand h1 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
.ver { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 1px 8px; }
.logo { display: inline-flex; gap: 3px; align-items: flex-end; height: 16px; }
.logo i { width: 4px; height: 9px; border-radius: 1px; background: var(--dim); }
.logo i:first-child { height: 16px; background: var(--accent); }
.status { flex: 1; min-width: 0; color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status.ok { color: var(--good); }
.status.warn { color: var(--warn); white-space: normal; }
.status.busy { color: var(--fg); }
.status.busy::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 50%; background: var(--accent); animation: pulse 0.9s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.25; } }

/* 패널 */
.panel { background: var(--panel); overflow-y: auto; min-height: 0; padding: 4px 0 20px; }
.panel.left { grid-area: left; border-right: 1px solid var(--line); }
.panel.right { grid-area: right; border-left: 1px solid var(--line); }
.panel section { padding: 14px 18px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
.panel h2 { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: var(--muted); }
.field { display: grid; gap: 6px; }
.field > label { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.note { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.55; }

.btn {
  border: 1px solid var(--line); background: var(--raise); border-radius: 8px; padding: 7px 12px; cursor: pointer;
  transition: background 0.12s, border-color 0.12s;
}
.btn:hover:not(:disabled) { border-color: #4a4337; background: #2d2922; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.sm { padding: 4px 10px; font-size: 12px; border-radius: 7px; }
.btn.ghost { background: transparent; }
.btn.accent { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.accent:hover:not(:disabled) { background: #ff9c40; border-color: #ff9c40; }
.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }

input[type="number"], input[type="text"], select {
  background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; min-width: 0;
}
input[type="text"] { flex: 1; }
.big-input { width: 92px; font-size: 18px; font-weight: 500; padding: 4px 8px; }
.num { width: 64px; font-size: 15px; }
output.big { font-size: 16px; min-width: 96px; text-align: center; }
input[type="range"] { width: 100%; accent-color: var(--accent); }

.switch { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 12.5px; }
.switch input { accent-color: var(--accent); width: 15px; height: 15px; }
.switch em { color: var(--dim); font-style: normal; font-family: var(--mono); font-size: 11px; }

.chip { font-size: 11px; padding: 2px 8px; border-radius: 99px; border: 1px solid currentColor; }
.chip.good { color: var(--good); }
.chip.warn { color: var(--warn); }

/* 파일 슬롯 */
.slot {
  display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto; column-gap: 10px;
  padding: 9px 12px; border: 1px dashed #3d372d; border-radius: 10px; cursor: pointer; background: var(--bg);
}
.slot:hover { border-color: var(--accent); }
.slot:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
.slot.filled { border-style: solid; background: var(--raise); }
.slot input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.slot-label { font-weight: 600; font-size: 13px; }
.slot-name { grid-row: 2; color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.slot.filled .slot-name { color: var(--fg); font-family: var(--mono); font-size: 11px; }
.slot-act { grid-row: 1 / 3; grid-column: 2; align-self: center; font-size: 11.5px; color: var(--accent); }

/* 트랙 */
.track { display: grid; grid-template-columns: 52px 64px 1fr; align-items: center; gap: 8px; }
.track.off { opacity: 0.5; }
.tbtn {
  border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 3px 0; font-size: 11.5px; cursor: pointer; color: var(--muted);
}
.tbtn.on { background: color-mix(in srgb, var(--c) 18%, transparent); border-color: var(--c); color: var(--c); font-weight: 600; }
.tlabel { font-size: 12.5px; }

.anchor-now { display: grid; gap: 6px; padding: 9px 10px; border-radius: 9px; background: var(--bg); border: 1px solid var(--line); }
.anchor-now > span { font-size: 13.5px; color: var(--accent); }

/* 가운데 */
.center { grid-area: center; display: flex; flex-direction: column; min-height: 0; min-width: 0; background: #0f0e0b; }
.stage-wrap { flex: 1; min-height: 0; position: relative; display: grid; place-items: center; padding: 16px; container-type: size; }
.stage { display: block; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); touch-action: none; background: #0d0c0a; }
.stage-v { height: min(100cqh, calc(100cqw * 16 / 9)); width: auto; }
.stage-h { width: min(100cqw, calc(100cqh * 16 / 9)); height: auto; }
.stage-f { height: min(100cqh, calc(100cqw * 5 / 4)); width: auto; }

.empty {
  position: absolute; left: 50%; top: 58%; transform: translate(-50%, -50%); width: min(340px, 80%);
  background: rgba(27,25,21,0.94); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; pointer-events: none;
}
.empty-title { margin: 0 0 8px; font-weight: 700; font-size: 14px; }
.empty ol { margin: 0; padding-left: 18px; display: grid; gap: 6px; color: var(--muted); font-size: 12.5px; }
.empty b { color: var(--fg); font-weight: 600; }
.empty-sub { margin: 12px 0 0; font-size: 11.5px; color: var(--dim); }

.transport { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-top: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
.btn.play { width: 44px; height: 36px; padding: 0; background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-size: 14px; font-weight: 700; }
.clock { display: flex; gap: 6px; font-size: 15px; margin-left: 6px; }
.barpos { margin-left: auto; display: flex; align-items: baseline; gap: 4px; font-size: 12px; color: var(--muted); }
.barpos b { font-size: 20px; color: var(--fg); font-weight: 500; }
.barpos b:first-child { color: var(--accent); }

/* 오른쪽 */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 8px 6px; cursor: pointer; display: grid; gap: 1px; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button small { font-size: 10.5px; color: var(--dim); }
.seg button.on { background: var(--raise); color: var(--fg); font-weight: 600; box-shadow: inset 0 -2px 0 var(--accent); }
.seg.small button { padding: 6px; font-size: 12px; }

.tpl-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.tpl-list li { display: flex; gap: 6px; }
.tpl-apply { flex: 1; text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 5px 10px; cursor: pointer; }
.tpl-apply:hover { border-color: var(--accent); }

.sheet-list { display: grid; gap: 8px; }
.sys { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--bg); }
.sys.active { border-color: var(--accent); }
.sys canvas { display: block; width: 100%; height: auto; }
.sys figcaption { display: flex; justify-content: space-between; padding: 4px 8px; font-size: 11px; color: var(--muted); }

/* 아래 */
.bottom { grid-area: bottom; border-top: 1px solid var(--line); background: var(--panel); min-width: 0; }
.timeline { padding: 8px 16px 0; }
.tl-head { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; flex-wrap: wrap; }
.tl-title { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: var(--muted); }
.tl-hint { font-size: 11px; color: var(--dim); }
.tl-zoom { margin-left: auto; display: flex; gap: 4px; }
.tl-canvas { border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
.tl-canvas canvas { display: block; cursor: text; touch-action: none; }
.keys { margin: 0; padding: 6px 16px 10px; font-size: 11px; color: var(--muted); }

@media (max-width: 1100px) {
  .app { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; grid-template-areas: "top" "center" "bottom" "left" "right"; }
  .top { flex-wrap: wrap; }
  .status { flex-basis: 100%; white-space: normal; }
  .stage-wrap { height: 70vh; }
  .panel { overflow: visible; border: 0; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* 멀티 앵글 */
.angles { display: grid; gap: 8px; }
.angle { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 10px; align-items: center; padding: 6px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.angle.active { border-color: var(--c); box-shadow: inset 0 0 0 1px var(--c); }
.angle-thumb { position: relative; padding: 0; border: 0; border-radius: 6px; overflow: hidden; cursor: pointer; background: #000; width: 54px; height: 72px; }
.angle-thumb canvas { display: block; width: 100%; height: 100%; }
.angle-num { position: absolute; left: 3px; top: 3px; min-width: 18px; height: 18px; border-radius: 5px; background: var(--c); color: #16130f; font-size: 11px; font-weight: 600; display: grid; place-items: center; }
.angle-body { display: grid; gap: 4px; min-width: 0; }
.angle-name { font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.tight { gap: 6px; }
.btn.xs { padding: 1px 6px; font-size: 11px; border-radius: 6px; }
.small { font-size: 11.5px; }
.link.danger { color: #ff7b7b; }
