<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>연주 영상 편집기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;700;900&family=Gothic+A1:wght@400;700;900&family=Nanum+Gothic:wght@400;700;800&family=Black+Han+Sans&family=Do+Hyeon&family=Jua&family=Sunflower:wght@500;700&family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Serif+KR:wght@400;700;900&family=Gowun+Batang:wght@400;700&family=Song+Myung&family=Gowun+Dodum&family=Nanum+Pen+Script&family=Gaegu:wght@400;700&family=Dongle:wght@400;700&display=swap">
<style>/* 레이아웃: 왼쪽 설정 · 가운데 미리보기 · 오른쪽 화면 구성 · 아래 타임라인 (연습실 조명 같은 따뜻한 다크) */
:root {
  --bg: #13110e;
  --panel: #1b1915;
  --raise: #25221c;
  --line: #312c24;
  --fg: #ece5d8;
  --muted: #a1988a;
  --dim: #6d6659;
  --accent: #ff8a1f;
  --accent-ink: #1d1104;
  --good: #63c58f;
  --warn: #f0b44c;
  --wave-v: #d9cbb2;
  --wave-r: #8bd26a;
  --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 13px/1.5 var(--font); }
#root { height: 100%; }
button, input, select { font: inherit; color: inherit; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.dim { color: var(--dim); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  height: 100%;
  display: grid;
  grid-template-columns: 300px minmax(0, 1fr) 292px;
  grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "top top top" "left center right" "bottom bottom bottom";
}
.hidden-video { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

/* 상단 */
.top {
  grid-area: top; display: flex; align-items: center; gap: 20px;
  padding: 10px 18px; border-bottom: 1px solid var(--line); background: var(--panel); min-width: 0;
}
.brand { display: flex; align-items: center; gap: 10px; flex: none; }
.brand h1 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
.ver { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 1px 8px; }
.logo { display: inline-flex; gap: 3px; align-items: flex-end; height: 16px; }
.logo i { width: 4px; height: 9px; border-radius: 1px; background: var(--dim); }
.logo i:first-child { height: 16px; background: var(--accent); }
.status { flex: 1; min-width: 0; color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status.ok { color: var(--good); }
.status.warn { color: var(--warn); white-space: normal; }
.status.busy { color: var(--fg); }
.status.busy::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 50%; background: var(--accent); animation: pulse 0.9s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.25; } }

/* 패널 */
.panel { background: var(--panel); overflow-y: auto; min-height: 0; padding: 4px 0 20px; }
.panel.left { grid-area: left; border-right: 1px solid var(--line); }
.panel.right { grid-area: right; border-left: 1px solid var(--line); }
.panel section { padding: 14px 18px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
.panel h2 { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: var(--muted); }
.field { display: grid; gap: 6px; }
.field > label { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.note { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.55; }

.btn {
  border: 1px solid var(--line); background: var(--raise); border-radius: 8px; padding: 7px 12px; cursor: pointer;
  transition: background 0.12s, border-color 0.12s;
}
.btn:hover:not(:disabled) { border-color: #4a4337; background: #2d2922; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.sm { padding: 4px 10px; font-size: 12px; border-radius: 7px; }
.btn.ghost { background: transparent; }
.btn.accent { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.accent:hover:not(:disabled) { background: #ff9c40; border-color: #ff9c40; }
.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }

input[type="number"], input[type="text"], select {
  background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; min-width: 0;
}
input[type="text"] { flex: 1; }
.big-input { width: 92px; font-size: 18px; font-weight: 500; padding: 4px 8px; }
.num { width: 64px; font-size: 15px; }
output.big { font-size: 16px; min-width: 96px; text-align: center; }
input[type="range"] { width: 100%; accent-color: var(--accent); }

.switch { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 12.5px; }
.switch input { accent-color: var(--accent); width: 15px; height: 15px; }
.switch em { color: var(--dim); font-style: normal; font-family: var(--mono); font-size: 11px; }

.chip { font-size: 11px; padding: 2px 8px; border-radius: 99px; border: 1px solid currentColor; }
.chip.good { color: var(--good); }
.chip.warn { color: var(--warn); }

/* 파일 슬롯 */
.slot {
  display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto; column-gap: 10px;
  padding: 9px 12px; border: 1px dashed #3d372d; border-radius: 10px; cursor: pointer; background: var(--bg);
}
.slot:hover { border-color: var(--accent); }
.slot:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
.slot.filled { border-style: solid; background: var(--raise); }
.slot input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.slot-label { font-weight: 600; font-size: 13px; }
.slot-name { grid-row: 2; color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.slot.filled .slot-name { color: var(--fg); font-family: var(--mono); font-size: 11px; }
.slot-act { grid-row: 1 / 3; grid-column: 2; align-self: center; font-size: 11.5px; color: var(--accent); }

/* 트랙 */
.track { display: grid; grid-template-columns: 52px 64px 1fr; align-items: center; gap: 8px; }
.track.off { opacity: 0.5; }
.tbtn {
  border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 3px 0; font-size: 11.5px; cursor: pointer; color: var(--muted);
}
.tbtn.on { background: color-mix(in srgb, var(--c) 18%, transparent); border-color: var(--c); color: var(--c); font-weight: 600; }
.tlabel { font-size: 12.5px; }

.anchor-now { display: grid; gap: 6px; padding: 9px 10px; border-radius: 9px; background: var(--bg); border: 1px solid var(--line); }
.anchor-now > span { font-size: 13.5px; color: var(--accent); }

/* 가운데 */
.center { grid-area: center; display: flex; flex-direction: column; min-height: 0; min-width: 0; background: #0f0e0b; }
.stage-wrap { flex: 1; min-height: 0; position: relative; display: grid; place-items: center; padding: 16px; container-type: size; }
.stage { display: block; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); touch-action: none; background: #0d0c0a; }
.stage-v { height: min(100cqh, calc(100cqw * 16 / 9)); width: auto; }
.stage-h { width: min(100cqw, calc(100cqh * 16 / 9)); height: auto; }

.empty {
  position: absolute; left: 50%; top: 58%; transform: translate(-50%, -50%); width: min(340px, 80%);
  background: rgba(27,25,21,0.94); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; pointer-events: none;
}
.empty-title { margin: 0 0 8px; font-weight: 700; font-size: 14px; }
.empty ol { margin: 0; padding-left: 18px; display: grid; gap: 6px; color: var(--muted); font-size: 12.5px; }
.empty b { color: var(--fg); font-weight: 600; }
.empty-sub { margin: 12px 0 0; font-size: 11.5px; color: var(--dim); }

.transport { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-top: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
.btn.play { width: 44px; height: 36px; padding: 0; background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-size: 14px; font-weight: 700; }
.clock { display: flex; gap: 6px; font-size: 15px; margin-left: 6px; }
.barpos { margin-left: auto; display: flex; align-items: baseline; gap: 4px; font-size: 12px; color: var(--muted); }
.barpos b { font-size: 20px; color: var(--fg); font-weight: 500; }
.barpos b:first-child { color: var(--accent); }

/* 오른쪽 */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 8px 6px; cursor: pointer; display: grid; gap: 1px; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button small { font-size: 10.5px; color: var(--dim); }
.seg button.on { background: var(--raise); color: var(--fg); font-weight: 600; box-shadow: inset 0 -2px 0 var(--accent); }
.seg.small button { padding: 6px; font-size: 12px; }

.tpl-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.tpl-list li { display: flex; gap: 6px; }
.tpl-apply { flex: 1; text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 5px 10px; cursor: pointer; }
.tpl-apply:hover { border-color: var(--accent); }

.sheet-list { display: grid; gap: 8px; }
.sys { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--bg); }
.sys.active { border-color: var(--accent); }
.sys canvas { display: block; width: 100%; height: auto; }
.sys figcaption { display: flex; justify-content: space-between; padding: 4px 8px; font-size: 11px; color: var(--muted); }

/* 아래 */
.bottom { grid-area: bottom; border-top: 1px solid var(--line); background: var(--panel); min-width: 0; }
.timeline { padding: 8px 16px 0; }
.tl-head { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; flex-wrap: wrap; }
.tl-title { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: var(--muted); }
.tl-hint { font-size: 11px; color: var(--dim); }
.tl-zoom { margin-left: auto; display: flex; gap: 4px; }
.tl-canvas { border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
.tl-canvas canvas { display: block; cursor: text; touch-action: none; }
.keys { margin: 0; padding: 6px 16px 10px; font-size: 11px; color: var(--muted); }

@media (max-width: 1100px) {
  .app { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; grid-template-areas: "top" "center" "bottom" "left" "right"; }
  .top { flex-wrap: wrap; }
  .status { flex-basis: 100%; white-space: normal; }
  .stage-wrap { height: 70vh; }
  .panel { overflow: visible; border: 0; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* 멀티 앵글 */
.angles { display: grid; gap: 8px; }
.angle { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 10px; align-items: center; padding: 6px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.angle.active { border-color: var(--c); box-shadow: inset 0 0 0 1px var(--c); }
.angle-thumb { position: relative; padding: 0; border: 0; border-radius: 6px; overflow: hidden; cursor: pointer; background: #000; width: 54px; height: 72px; }
.angle-thumb canvas { display: block; width: 100%; height: 100%; }
.angle-num { position: absolute; left: 3px; top: 3px; min-width: 18px; height: 18px; border-radius: 5px; background: var(--c); color: #16130f; font-size: 11px; font-weight: 600; display: grid; place-items: center; }
.angle-body { display: grid; gap: 4px; min-width: 0; }
.angle-name { font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.tight { gap: 6px; }
.btn.xs { padding: 1px 6px; font-size: 11px; border-radius: 6px; }
.small { font-size: 11.5px; }
.link.danger { color: #ff7b7b; }
.shift { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; }
.shift-val { display: grid; text-align: center; font-weight: 600; font-size: 13px; }
.shift-val small { font-weight: 400; font-size: 11px; color: var(--muted); }

/* 추출 창 */
.export-btn { margin-left: 8px; }
.modal-back { position: fixed; inset: 0; background: rgba(8,7,5,0.7); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal { width: min(460px, 100%); max-height: 100%; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.modal-head h2 { margin: 0; font-size: 15px; }
.modal-body { padding: 16px 18px 18px; display: grid; gap: 14px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.summary { margin: 0; display: grid; gap: 6px; padding: 10px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 9px; }
.summary div { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 8px; font-size: 12.5px; }
.summary dt { color: var(--muted); }
.summary dd { margin: 0; overflow-wrap: anywhere; }
.btn.wide { width: 100%; padding: 10px; font-size: 14px; }
.stage { margin: 0; font-weight: 600; font-size: 14px; }
.bar { height: 10px; border-radius: 99px; background: var(--bg); border: 1px solid var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); transition: width 0.3s; }
.warn-text { color: var(--warn); }
.ok-text { color: var(--good); }
.seg button:disabled { opacity: 0.35; cursor: not-allowed; }
.undo { display: flex; gap: 4px; flex: none; }

/* 클라우드 */
.cloudbar { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 0 1 auto; }
.title-input { width: 200px; background: transparent; border: 1px solid transparent; border-radius: 7px; padding: 4px 8px; font-weight: 600; }
.title-input:hover:not(:disabled), .title-input:focus { border-color: var(--line); background: var(--bg); }
.save { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.save.saved { color: var(--good); }
.save.error { color: var(--warn); }
.userchip { display: flex; align-items: center; gap: 6px; flex: none; order: 10; }
.userchip img, .avatar { width: 24px; height: 24px; border-radius: 50%; }
.avatar { display: grid; place-items: center; background: var(--raise); font-size: 12px; }
.uname { font-size: 12px; }
.uname small { color: var(--accent); }
.modal.wide { width: min(720px, 100%); }
.pj-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; max-height: 52vh; overflow: auto; }
.pj-list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.pj-list li.current { border-color: var(--accent); }
.pj-main { display: grid; gap: 2px; min-width: 0; }
.pj-title { font-weight: 600; display: flex; align-items: center; gap: 8px; }
.pj-meta { font-size: 11.5px; color: var(--muted); }
.pj-files { font-size: 11px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pj-act { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.tag { font-size: 10.5px; font-weight: 600; color: var(--accent); border: 1px solid var(--accent); border-radius: 99px; padding: 0 7px; }
.btn.danger { background: #b83c3c; border-color: #b83c3c; color: #fff; }
.member-form { display: grid; grid-template-columns: 1fr 1.3fr auto; gap: 6px; }
.members { display: grid; gap: 10px; }
.tpl-by { color: var(--muted); font-size: 11px; }
.needed { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(380px, 86%); background: rgba(27,25,21,0.96); border: 1px solid var(--accent); border-radius: 14px; padding: 16px 18px; display: grid; gap: 10px; z-index: 2; }
.needed-title { margin: 0; font-weight: 700; }
.needed ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.needed li { display: grid; grid-template-columns: 20px 70px minmax(0, 1fr); gap: 6px; align-items: center; font-size: 12.5px; }
.needed li .mono { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11.5px; }
.needed .chk { width: 18px; height: 18px; border-radius: 5px; border: 1px solid var(--line); display: grid; place-items: center; font-size: 12px; }
.needed li.ok .chk { background: var(--good); border-color: var(--good); color: #10200f; }
.needed li.ok { color: var(--muted); }
.needed-label { color: var(--muted); }
.login { height: 100%; display: grid; place-items: center; padding: 16px; background: radial-gradient(circle at 50% 30%, #241f17, var(--bg) 70%); }
.login-card { width: min(380px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 28px 26px; display: grid; gap: 14px; text-align: center; justify-items: center; }
.brand.big h1 { font-size: 20px; }
.login-sub { margin: 0; color: var(--muted); }
.btn.google { display: inline-flex; align-items: center; gap: 10px; background: #fff; color: #1f1f1f; border-color: #fff; font-weight: 600; padding: 10px 18px; }
.btn.google:hover:not(:disabled) { background: #f1f1f1; border-color: #f1f1f1; }
.usage { display: grid; gap: 6px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.usage-row { display: flex; justify-content: space-between; font-size: 12.5px; }
.bar.near i { background: var(--warn); }
.bar.over i { background: #e05555; }
.pj-cloud { font-size: 11px; color: var(--dim); }
.pj-cloud.on { color: var(--wave-r); }
.srcbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 16px 0; }
.src-tag { font-size: 12px; font-weight: 700; color: #10201e; background: var(--c); border-radius: 99px; padding: 3px 10px; }
/* 자막 */
.cap-edit { display: grid; gap: 6px; padding: 8px; border: 1px solid #ffd27a; border-radius: 9px; background: var(--bg); }
.cap-edit textarea { width: 100%; resize: vertical; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; font: 600 13px var(--font); }
.cap-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; max-height: 150px; overflow: auto; }
.cap-list button { width: 100%; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 6px; text-align: left; background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 3px 6px; cursor: pointer; font-size: 12px; }
.cap-list button:hover { border-color: var(--line); }
.cap-list button.on { border-color: #ffd27a; background: var(--bg); }
.cap-list .mono { color: var(--muted); font-size: 11px; }
.cap-txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.swatch { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; padding: 0; }
.swatch.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--bg) inset; }
.grow { flex: 1; }
/* 효과 */
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 2; }
.tabs button { background: transparent; border: 0; padding: 11px; cursor: pointer; color: var(--muted); font-weight: 600; }
.tabs button.on { color: var(--fg); box-shadow: inset 0 -2px 0 var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chips button { border: 1px solid var(--line); background: var(--bg); border-radius: 99px; padding: 4px 10px; font-size: 12px; cursor: pointer; color: var(--muted); }
.chips button.on { border-color: var(--accent); color: var(--fg); background: color-mix(in srgb, var(--accent) 16%, var(--bg)); }
.chips button:disabled { opacity: 0.35; cursor: not-allowed; }
.subbox { display: grid; gap: 8px; padding: 9px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); }
.logo-thumb { height: 32px; max-width: 90px; object-fit: contain; background: #fff2; border-radius: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
/* 자막 스튜디오 (미리보기 왼쪽) */
.center-row { flex: 1; min-height: 0; display: flex; }
.center-row .stage-wrap { flex: 1; min-width: 0; }
.cap-studio { width: 300px; flex: none; overflow-y: auto; border-right: 1px solid var(--line); background: var(--panel); padding: 12px 14px 20px; display: grid; grid-auto-rows: max-content; gap: 12px; align-content: start; animation: cs-drop .25s ease-out; }
@keyframes cs-drop { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }
/* 접힌 자막 탭: 원래 세로 탭 + 살짝 노란 기운 */
.studio-tab { flex: none; writing-mode: vertical-rl; display: flex; align-items: center; gap: 7px; border: 0; border-right: 1px solid var(--line); box-shadow: inset 2px 0 0 #ffd27a;
  background: linear-gradient(90deg, rgba(255,210,122,0.07), transparent 80%), var(--panel); color: #f3d79a; padding: 14px 7px; cursor: pointer; font-weight: 600; font-size: 13px; }
.studio-tab:hover { color: #ffe3a6; background: linear-gradient(90deg, rgba(255,210,122,0.14), transparent 80%), var(--panel); }
.st-ico { writing-mode: horizontal-tb; width: 18px; height: 18px; border-radius: 5px; border: 1px solid rgba(255,210,122,0.55); display: grid; place-items: center; font: 700 11px Georgia, serif; }
.st-n { writing-mode: horizontal-tb; font: 600 10.5px var(--mono); color: var(--muted); }
.st-arr { writing-mode: horizontal-tb; font-size: 9px; color: var(--muted); }
.cs-head { display: flex; align-items: center; gap: 6px; }
.cs-head h2 { margin: 0 auto 0 0; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: var(--muted); }
.cs-block { display: grid; gap: 7px; padding: 9px; border: 1px solid #ffd27a; border-radius: 10px; background: var(--bg); }
.cs-input { width: 100%; box-sizing: border-box; resize: vertical; background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; font: 600 14px var(--font); }
.cs-group { display: grid; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); }
.cs-group h3 { margin: 0; font-size: 12px; font-weight: 600; color: var(--fg); }
.row.between { justify-content: space-between; }
.font-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.font-grid button { display: grid; gap: 1px; text-align: left; padding: 6px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); cursor: pointer; color: var(--fg); }
.font-grid button.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--bg)); }
.fg-sample { font-size: 16px; line-height: 1.2; white-space: nowrap; overflow: hidden; }
.fg-name { font: 500 10.5px var(--font); color: var(--muted); }
.color-in { width: 30px; height: 26px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; cursor: pointer; }
.own-dot { width: 7px; height: 7px; border-radius: 50%; background: #ffd27a; align-self: center; }
.cap-list button { grid-template-columns: 44px minmax(0, 1fr) auto; }
.cap-list { max-height: 170px; }

.seg-menu { position: fixed; z-index: 60; width: 340px; display: grid; gap: 10px; padding: 12px; background: var(--raise); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 14px 40px rgba(0,0,0,.55); }
.seg-menu .sm-head { display: flex; align-items: center; gap: 8px; }
.seg-menu .sm-head .btn { margin-left: auto; }
.seg-menu .sm-badge { min-width: 22px; height: 22px; padding: 0 6px; border-radius: 6px; display: inline-grid; place-items: center; color: #16130f; font: 700 12px "IBM Plex Mono", monospace; }
.seg-menu .sm-row { display: grid; gap: 6px; }
.seg-menu .sm-lab { font-size: 12px; color: var(--muted); }
.seg-menu .danger-btn { color: #ff7a7a; border-color: rgba(255,122,122,.4); }
.seg-menu .danger-btn:hover { background: rgba(255,122,122,.12); }

.cs-input:focus { outline: none; border-color: #ffd27a; }
.cs-input::placeholder { color: var(--dim); font-weight: 500; font-size: 13px; }
.font-pick { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); cursor: pointer; }
.font-pick:hover { border-color: #5a5142; }
.font-pick .fp-name { font-size: 15px; }
.font-pick .fp-arr { font-size: 10px; color: var(--muted); transition: transform .2s; }
.font-pick.open .fp-arr { transform: rotate(180deg); }
.font-grid { animation: cs-drop .2s ease-out; }

.mark-seg button { display: inline-flex; align-items: center; justify-content: center; gap: 5px; white-space: nowrap; }
.mk-dot { width: 8px; height: 8px; flex: none; }
.mk-punch .mk-dot { background: #ff8a1f; transform: rotate(45deg); border-radius: 1px; }
.mk-flash .mk-dot { background: #ffe14d; border-radius: 50%; box-shadow: 0 0 6px #ffe14d; }
.mk-shake .mk-dot { height: 3px; background: #56c2b4; border-radius: 2px; }

.mark-menu { width: 280px; }
.mark-menu .sm-head { gap: 4px; }
.mark-menu .sm-head .btn:last-child { margin-left: auto; }
.mark-menu .sm-head .btn { margin-left: 0; }
.mk-big { display: inline-grid; place-items: center; width: 20px; height: 20px; }
.mk-big .mk-dot { width: 10px; height: 10px; }
.mk-big.mk-shake .mk-dot { width: 12px; height: 3px; }

.subbox.sel-card { border-color: #7fb2ff; box-shadow: 0 0 0 1px #7fb2ff inset; }
.pickbar { border-color: rgba(255,138,31,0.5); }

.stage-box { position: relative; line-height: 0; }
.cap-inline { position: absolute; z-index: 4; box-sizing: border-box; resize: none; overflow: hidden; padding: 0.15em 0.3em; margin: 0;
  background: rgba(10,9,7,0.82); border: 2px solid #ffd27a; border-radius: 6px; font-weight: 700; outline: none; box-shadow: 0 8px 30px rgba(0,0,0,0.5); }
</style>
